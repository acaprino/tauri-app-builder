[package]
name = "{{CRATE_NAME}}"
version = "0.1.0"
description = "{{PRODUCT_NAME}}"
edition = "2021"
rust-version = "1.90"

[lib]
name = "{{LIB_NAME}}"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7" }

[dependencies]
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2.7"

# Desktop only: these plugins have no Android support (see native-plugins-data.md).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
