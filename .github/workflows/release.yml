name: Release

# Publishes a tag and a GitHub Release for the version in
# .claude-plugin/plugin.json, with the matching section of CHANGELOG.md as
# notes. Runs on every push to main and does nothing when the tag exists.
# Run it by hand with a commit to release an earlier version.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to release (defaults to the tip of main)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the plugin and skill bundles
        run: |
          python scripts/validate_plugin.py
          python -m unittest discover -s scripts -p "test_*.py"
          cd skills/tauri-native-mobile
          python scripts/validate_bundle.py
          python -m unittest discover -s scripts -p "test_*.py"

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          target=$(git rev-parse --verify "${REF_INPUT:-HEAD}^{commit}")
          version=$(git show "$target:.claude-plugin/plugin.json" \
            | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version: $version" >&2
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to release."
            exit 0
          fi

          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "tauri-app-builder $tag" "$target"
          git push origin "$tag"

          latest=true
          if [ "$target" != "$(git rev-parse HEAD)" ]; then latest=false; fi
          gh release create "$tag" --verify-tag --title "$tag" \
            --notes-file notes.md --latest="$latest"
